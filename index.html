<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Chat to PDF</title>
    <link rel="stylesheet" href="styles/app.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="version">v1.1.1</div>
            <h1>📱 WhatsApp Chat to PDF</h1>
            <p>Convert your WhatsApp chat exports into beautiful PDF documents</p>
        </div>

        <div class="upload-section">
            <div class="upload-box" id="uploadBox">
                <div class="upload-icon">📁</div>
                <h3>Drop your WhatsApp chat ZIP file here</h3>
                <p>or click to browse</p>
                <input type="file" id="fileInput" accept=".zip">
            </div>

            <button class="btn" id="openHtmlBtn" disabled>Open as HTML Page</button>
            <button class="btn" id="downloadHtmlBtn" disabled style="margin-left: 10px;">Download HTML File</button>

            <div class="status" id="status"></div>

            <div class="date-filter" id="dateFilter">
                <h3>📅 Filter by Date Range (Optional)</h3>
                <div class="date-inputs">
                    <div class="date-group">
                        <label for="startDate">From Date:</label>
                        <input type="date" id="startDate">
                    </div>
                    <div class="date-group">
                        <label for="endDate">To Date:</label>
                        <input type="date" id="endDate">
                    </div>
                    <button class="btn-reset" id="clearFilterBtn">Clear Filter</button>
                </div>
                <div class="filter-info" id="filterInfo">
                    💡 Leave empty to include all messages
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p id="loadingText">Processing your chat...</p>
            </div>

            <div class="preview" id="preview">
                <h3 style="margin-bottom: 15px;">Preview (Last 50 messages)</h3>
                <div class="chat-preview" id="chatPreview"></div>
            </div>
        </div>
    </div>

    <!-- Hidden container for PDF generation -->
    <div id="pdfContent" class="pdf-content"></div>

    <!-- Click-to-expand image lightbox -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Expanded image">
        <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
        <img id="lightboxImg" alt="">
    </div>

    <!--
        Classic scripts (not ES modules) so the page also works when opened
        directly via file:// (`npm run open`). Load order matters: state.js
        must come first so DOM-ref globals are defined before any consumer
        runs; main.js comes last so all helper functions are already defined.
    -->
    <script src="scripts/state.js"></script>
    <script src="scripts/ui.js"></script>
    <script src="scripts/formatters.js"></script>
    <script src="scripts/parser.js"></script>
    <script src="scripts/filter.js"></script>
    <script src="scripts/preview.js"></script>
    <script src="scripts/fileHandler.js"></script>
    <script src="scripts/export.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
